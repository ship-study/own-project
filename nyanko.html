<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にゃんこ大戦争風バトル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
        }

        body {
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* ゲーム画面（ステージ） */
        #game-stage {
            width: 800px;
            height: 350px;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 70%, #8bc34a 70%, #689f38 100%);
            border: 4px solid #fff;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        /* 自城・敵城 */
        .castle {
            position: absolute;
            bottom: 30px;
            width: 80px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            font-size: 50px;
            z-index: 2;
        }

        #player-castle { left: 20px; }
        #enemy-castle { right: 20px; }

        .hp-bar-bg {
            width: 70px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #fff;
            border-radius: 5px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.1s ease;
        }

        /* キャラクター */
        .unit {
            position: absolute;
            bottom: 30px;
            font-size: 38px;
            transform: translateX(-50%);
            z-index: 3;
            transition: left 0.05s linear;
        }

        .unit.enemy {
            transform: translateX(-50%) scaleX(-1); /* 敵は左向き */
        }

        /* 操作パネル */
        #ui-panel {
            width: 800px;
            background: #333;
            border: 4px solid #fff;
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .money-display {
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 2px 2px 0 #000;
        }

        .spawn-buttons {
            display: flex;
            gap: 10px;
        }

        .spawn-btn {
            background: #ff9800;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #b26a00;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spawn-btn:hover:not(:disabled) {
            background: #ffa726;
            transform: translateY(-2px);
        }

        .spawn-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b26a00;
        }

        .spawn-btn:disabled {
            background: #777;
            box-shadow: 0 4px 0 #444;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cost-text {
            font-size: 0.8rem;
            color: #ffff00;
        }

        /* スマホ対応のレスポンシブ */
        @media (max-width: 820px) {
            #game-stage, #ui-panel {
                width: 95vw;
            }
            #game-stage { height: 260px; }
            .unit { font-size: 28px; }
            .castle { font-size: 35px; height: 100px; }
        }
    </style>
</head>
<body>

    <!-- ゲーム画面 -->
    <div id="game-stage">
        <!-- 自城（味方） -->
        <div class="castle" id="player-castle">
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="player-hp"></div></div>
            🏰
        </div>

        <!-- 敵城 -->
        <div class="castle" id="enemy-castle">
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="enemy-hp"></div></div>
            🏯
        </div>
    </div>

    <!-- UI（お金・ボタン） -->
    <div id="ui-panel">
        <div class="money-display">
            💰 お金: <span id="money">0</span> 円
        </div>
        <div class="spawn-buttons">
            <button class="spawn-btn" id="btn-cat" onclick="spawnUnit('cat')">
                🐱 にゃんこ
                <span class="cost-text">50円</span>
            </button>
            <button class="spawn-btn" id="btn-tank" onclick="spawnUnit('tank')">
                🛡️ タンクにゃんこ
                <span class="cost-text">150円</span>
            </button>
            <button class="spawn-btn" id="btn-giga" onclick="spawnUnit('giga')">
                🦁 巨体にゃんこ
                <span class="cost-text">400円</span>
            </button>
        </div>
    </div>

    <script>
        // --- ゲームの基本設定 ---
        const STAGE_WIDTH = 800;
        const CASTLE_PLAYER_X = 60;
        const CASTLE_ENEMY_X = 740;

        let money = 0;
        const maxMoney = 1000;
        let isGameOver = false;

        let playerCastleHp = 1000;
        let enemyCastleHp = 1000;

        // 味方ユニットの種類定義
        const UNIT_TYPES = {
            cat:  { emoji: '🐱', cost: 50,  hp: 100, atk: 15, speed: 2, range: 25 },
            tank: { emoji: '🛡️', cost: 150, hp: 350, atk: 8,  speed: 1, range: 20 },
            giga: { emoji: '🦁', cost: 400, hp: 600, atk: 60, speed: 1.5, range: 35 }
        };

        // 敵ユニットの種類定義
        const ENEMY_TYPES = {
            dog: { emoji: '🐶', hp: 80,  atk: 10, speed: 1.8, range: 25 },
            snake: { emoji: '🐍', hp: 200, atk: 25, speed: 1.2, range: 20 },
            gorilla: { emoji: '🦍', hp: 700, atk: 50, speed: 1.0, range: 30 }
        };

        let activeUnits = []; // 盤面にいる全ユニット（味方・敵）
        let enemySpawnTimer = 0;

        // --- メインループ ---
        function gameLoop() {
            if (isGameOver) return;

            // 1. お金の自動増加
            if (money < maxMoney) {
                money += 0.8;
                updateUI();
            }

            // 2. 敵の自動スポーン（約3秒ごと）
            enemySpawnTimer++;
            if (enemySpawnTimer > 180) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            // 3. ユニットの移動と戦闘処理
            updateUnits();

            // 4. 勝敗判定
            checkGameOver();

            requestAnimationFrame(gameLoop);
        }

        // --- ユニットの生成 ---
        function spawnUnit(typeKey) {
            const type = UNIT_TYPES[typeKey];
            if (money >= type.cost && !isGameOver) {
                money -= type.cost;
                updateUI();

                const unit = {
                    id: Math.random(),
                    side: 'player',
                    emoji: type.emoji,
                    hp: type.hp,
                    maxHp: type.hp,
                    atk: type.atk,
                    speed: type.speed,
                    range: type.range,
                    x: CASTLE_PLAYER_X,
                    el: createUnitElement(type.emoji, 'player')
                };
                activeUnits.push(unit);
            }
        }

        function spawnEnemy() {
            const rand = Math.random();
            let eType = ENEMY_TYPES.dog;
            if (rand > 0.8) eType = ENEMY_TYPES.gorilla;
            else if (rand > 0.5) eType = ENEMY_TYPES.snake;

            const enemy = {
                id: Math.random(),
                side: 'enemy',
                emoji: eType.emoji,
                hp: eType.hp,
                maxHp: eType.hp,
                atk: eType.atk,
                speed: eType.speed,
                range: eType.range,
                x: CASTLE_ENEMY_X,
                el: createUnitElement(eType.emoji, 'enemy')
            };
            activeUnits.push(enemy);
        }

        // --- HTML要素の作成 ---
        function createUnitElement(emoji, side) {
            const el = document.createElement('div');
            el.className = `unit ${side}`;
            el.innerText = emoji;
            document.getElementById('game-stage').appendChild(el);
            return el;
        }

        // --- 移動 & 攻撃ロジック ---
        function updateUnits() {
            activeUnits.forEach(unit => {
                if (unit.hp <= 0) return;

                if (unit.side === 'player') {
                    // 味方：目の前の敵を探す
                    const target = activeUnits.find(other => 
                        other.side === 'enemy' && other.hp > 0 && other.x > unit.x && (other.x - unit.x) <= unit.range
                    );

                    if (target) {
                        target.hp -= unit.atk * 0.05;
                    } else if (CASTLE_ENEMY_X - unit.x <= unit.range) {
                        enemyCastleHp -= unit.atk * 0.05;
                        if (enemyCastleHp < 0) enemyCastleHp = 0;
                    } else {
                        unit.x += unit.speed;
                    }
                } else {
                    // 敵：目の前の味方を探す
                    const target = activeUnits.find(other => 
                        other.side === 'player' && other.hp > 0 && other.x < unit.x && (unit.x - other.x) <= unit.range
                    );

                    if (target) {
                        target.hp -= unit.atk * 0.05;
                    } else if (unit.x - CASTLE_PLAYER_X <= unit.range) {
                        playerCastleHp -= unit.atk * 0.05;
                        if (playerCastleHp < 0) playerCastleHp = 0;
                    } else {
                        unit.x -= unit.speed;
                    }
                }

                unit.el.style.left = `${unit.x}px`;
            });

            // 倒れたユニットの削除
            activeUnits = activeUnits.filter(unit => {
                if (unit.hp <= 0) {
                    unit.el.remove();
                    return false;
                }
                return true;
            });

            // HPバー更新
            document.getElementById('player-hp').style.width = `${(playerCastleHp / 1000) * 100}%`;
            document.getElementById('enemy-hp').style.width = `${(enemyCastleHp / 1000) * 100}%`;
        }

        // --- UI更新 ---
        function updateUI() {
            document.getElementById('money').innerText = Math.floor(money);
            document.getElementById('btn-cat').disabled = money < UNIT_TYPES.cat.cost;
            document.getElementById('btn-tank').disabled = money < UNIT_TYPES.tank.cost;
            document.getElementById('btn-giga').disabled = money < UNIT_TYPES.giga.cost;
        }

        // --- 勝敗チェック ---
        function checkGameOver() {
            if (enemyCastleHp <= 0) {
                isGameOver = true;
                alert('🎉 勝利！敵城を破壊しました！');
                location.reload();
            } else if (playerCastleHp <= 0) {
                isGameOver = true;
                alert('💀 敗北…城が破壊されました。');
                location.reload();
            }
        }

        // ゲームスタート
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
