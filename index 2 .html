        ];

        let currentCategory = 'all';

        function renderCards() {
            const grid = document.getElementById('elementGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = elements.filter(el => {
                const matchesCategory = (currentCategory === 'all' || el.cat === currentCategory);
                const matchesSearch = el.name.toLowerCase().includes(searchVal) || 
                                      el.symbol.toLowerCase().includes(searchVal) || 
                                      el.reading.toLowerCase().includes(searchVal) ||
                                      el.item.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p style="font-weight:800; color:#fff; text-align:center; grid-column: 1/-1;">該当する元素が見つかりませんでした 🔍</p>';
                return;
            }

            filtered.forEach(el => {
                const card = document.createElement('div');
                card.className = 'element-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="atomic-num">No. ${el.num}</span>
                        <span class="symbol">${el.symbol}</span>
                    </div>
                    <div class="name-jp">${el.name}</div>
                    <div class="reading">${el.reading}</div>
                    <div class="item-box">
                        <div class="item-title">🏠 身近にある例・使い道</div>
                        <div class="item-text">${el.item}</div>
                    </div>
                    <div class="trick-box">
                        <div class="trick-title">💡 特徴</div>
                        <div class="trick-text">${el.trick}</div>
                    </div>
                    <span class="tag">${el.cat}</span>
                `;
                grid.appendChild(card);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('goroTableBody');
            tbody.innerHTML = '';
            elements.forEach(el => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${el.num}</td>
                    <td style="font-size:1.3rem; font-weight:900; color:#1e3c72; background:#fffde7;">${el.symbol}</td>
                    <td style="font-weight:900;">${el.name}</td>
                    <td>${el.reading}</td>
                    <td>${el.item}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterCategory(evt, cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            evt.target.classList.add('active');
            renderCards();
        }

        // 初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchInput').addEventListener('input', renderCards);
            renderCards();
            renderTable();
        });
    </script>
