<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学4年生までの 国・算・理・社 クイズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef7ff;
            --main-color: #0288d1;
            --btn-color: #29b6f6;
            --btn-hover: #0288d1;
            --border-color: #01579b;
            --card-bg: #ffffff;
            --shadow: 4px 4px 0px #01579b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 20px 10px 60px;
            min-height: 100vh;
        }

        header {
            max-width: 700px;
            margin: 0 auto 20px;
            text-align: center;
            background-color: #e1f5fe;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--border-color);
            font-weight: 900;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            border: 4px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px dashed var(--border-color);
        }

        .subject-badge {
            background-color: #ffe082;
            color: #e65100;
            padding: 4px 12px;
            border-radius: 10px;
            border: 2px solid #e65100;
            font-size: 1rem;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 900;
            margin: 20px 0;
            color: #01579b;
            text-align: left;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: var(--btn-color);
            color: #ffffff;
            border: 3px solid var(--border-color);
            padding: 14px 15px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: var(--shadow);
            text-align: left;
            transition: all 0.1s ease;
        }

        .option-btn:hover {
            background-color: var(--btn-hover);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .feedback-box {
            min-height: 60px;
            font-size: 1.1rem;
            font-weight: 900;
            margin: 15px 0;
            text-align: left;
        }

        .explanation {
            background-color: #f1f8e9;
            border: 2px solid #33691e;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.95rem;
            color: #1b5e20;
            margin-top: 8px;
        }

        .control-btn {
            background-color: #ffe082;
            color: #333;
            border: 3px solid var(--border-color);
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: var(--shadow);
            margin-top: 10px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--border-color);
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 2.8rem;
            font-weight: 900;
            color: #e65100;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎓 小学4年生までの 国・算・理・社 クイズ 🎓</h1>
    </header>

    <div class="container">
        <!-- クイズ画面 -->
        <div class="card" id="quizScreen">
            <div class="status-bar">
                <span class="subject-badge" id="subjectBadge">国語</span>
                <span id="progressText">第 1 問 / 全 10 問</span>
            </div>

            <div class="question-text" id="questionText">問題がここに表示されます</div>

            <div class="options-grid" id="optionsGrid">
                <!-- 選択肢ボタン -->
            </div>

            <div class="feedback-box" id="feedbackBox"></div>

            <button class="control-btn" id="nextBtn" style="display: none;" onclick="nextQuestion()">次の問題へ ➔</button>
        </div>

        <!-- 結果画面 -->
        <div class="card" id="resultScreen" style="display: none;">
            <div class="result-title">🎉 クイズしゅうりょう！ 🎉</div>
            <div class="result-score" id="finalScore">0 / 10 問 正解！</div>
            <div class="result-msg" id="resultMsg" style="font-size: 1.2rem; font-weight: 800; margin-bottom: 20px;"></div>
            <button class="control-btn" onclick="startNewQuiz()">もう一度挑戦する 🔄</button>
        </div>
    </div>

    <script>
        // 国語・算数・理科・社会（小学4年生まで）の問題データ（全10問）
        const quizData = [
            {
                subject: "国語",
                question: "「偏（へん）」が「日（ひへん）」の漢字はどれでしょう？",
                options: ["晴", "語", "休"],
                answer: "晴",
                explanation: "「晴」は「日（ひへん）」、「語」は「言（ごんべん）」、「休」は「人（にんべん）」です。"
            },
            {
                subject: "国語",
                question: "失敗しても、あきらめずに何度も立ち上がることをあらわす言葉（ことわざ）はどれでしょう？",
                options: ["七転び八起き（ななころびやおき）", "石の上にも三年", "犬も歩けば棒に当たる"],
                answer: "七転び八起き（ななころびやおき）",
                explanation: "7回倒れても8回起き上がるように、何度失敗してもくじけないことを意味します。"
            },
            {
                subject: "算数",
                question: "ケーキが23個あります。1箱に4個ずつ入れると、ケーキが全部入る箱は最低なん箱必要でしょう？",
                options: ["6箱", "5箱", "7箱"],
                answer: "6箱",
                explanation: "23 ÷ 4 = 5 あまり 3 です。5箱では3個あまってしまうので、ぜんぶ入れるには【6箱】必要です。"
            },
            {
                subject: "算数",
                question: "分度器をつかって角度をはかるとき、まっすぐな直線（平らな角）の大きさは何度でしょう？",
                options: ["180度", "90度", "360度"],
                answer: "180度",
                explanation: "直角（90度）の2倍で、まっすぐな角は180度になります。"
            },
            {
                subject: "理科",
                question: "乾電池2個をつなぐとき、一番プロペラが速く回る（豆電球が明るく光る）つなぎ方はどれでしょう？",
                options: ["直列つなぎ（ちょくれつ）", "並列つなぎ（へいれつ）", "どちらも同じ"],
                answer: "直列つなぎ（ちょくれつ）",
                explanation: "直列つなぎにすると流れる電流が強くなり、プロペラが速く回ったり豆電球が明るくなったりします。"
            },
            {
                subject: "理科",
                question: "夜空に見える「月」や「星」は、時間がたつとどの方角からどの方角へ動いて見えますか？",
                options: ["東 から 西", "西 から 東", "北 から 南"],
                answer: "東 から 西",
                explanation: "太陽と同じように、月や星も「東」から上って「西」へ沈んで見えます。"
            },
            {
                subject: "理科",
                question: "水を加熱して沸とうさせたときに出てくる「あわ」の正体は何でしょう？",
                options: ["水蒸気（すいじょうき）", "空気", "酸素（さんそ）"],
                answer: "水蒸気（すいじょうき）",
                explanation: "水が気体になった「水蒸気」があわの正体です。"
            },
            {
                subject: "社会",
                question: "日本で一番面積（広さ）が大きい都道府県はどこでしょう？",
                options: ["北海道", "東京都", "沖縄県"],
                answer: "北海道",
                explanation: "日本の47都道府県の中で、ダントツで一番広いのが北海道です。"
            },
            {
                subject: "社会",
                question: "ごみを減らす行動「3R」のうち、「いらないごみを減らす・出さない」ことを意味する言葉はどれでしょう？",
                options: ["リデュース（Reduce）", "リユース（Reuse）", "リサイクル（Recycle）"],
                answer: "リデュース（Reduce）",
                explanation: "リデュース（減らす）、リユース（再使用）、リサイクル（再資源化）の3つをあわせて3Rと呼びます。"
            },
            {
                subject: "社会",
                question: "火事（かじ）が起きたときに連絡する消防署（しょうぼうしょ）の電話番号は何番でしょう？",
                options: ["119番", "110番", "118番"],
                answer: "119番",
                explanation: "火事や救急車は「119番」です。（※110番は警察、118番は海上保安庁）"
            }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startNewQuiz() {
            currentQuestions = shuffleArray(quizData);
            currentIndex = 0;
            score = 0;

            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';

            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentIndex];

            document.getElementById('subjectBadge').innerText = q.subject;
            document.getElementById('progressText').innerText = `第 ${currentIndex + 1} 問 / 全 10 問`;
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('feedbackBox').innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';

            const shuffledOptions = shuffleArray(q.options);
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, qData, clickedBtn) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            const feedbackBox = document.getElementById('feedbackBox');

            if (selected === qData.answer) {
                score++;
                clickedBtn.style.backgroundColor = '#2e7d32';
                feedbackBox.innerHTML = `
                    <div style="color: #2e7d32;">⭕ 正解！</div>
                    <div class="explanation">💡 解説：${qData.explanation}</div>
                `;
            } else {
                clickedBtn.style.backgroundColor = '#d32f2f';
                feedbackBox.innerHTML = `
                    <div style="color: #d32f2f;">❌ 残念！ 正解は「${qData.answer}」</div>
                    <div class="explanation">💡 解説：${qData.explanation}</div>
                `;
            }

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';

            document.getElementById('finalScore').innerText = `${score} / 10 問 正解！`;

            const resultMsg = document.getElementById('resultMsg');
            if (score === 10) {
                resultMsg.innerText = '💯 パーフェクト！4教科すべてバッチリだね！';
            } else if (score >= 7) {
                resultMsg.innerText = '🌟 すごい！得意分野がたくさんあるね！';
            } else if (score >= 5) {
                resultMsg.innerText = '👍 あと少し！苦手な問題をおさらいしてみよう！';
            } else {
                resultMsg.innerText = '📖 何度も挑戦して全問正解をめざそう！';
            }
        }

        startNewQuiz();
    </script>
</body>
</html>
